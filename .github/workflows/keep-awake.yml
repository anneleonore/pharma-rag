name: Keep apps awake
on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours
  workflow_dispatch:           # also lets you run it by hand
jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python .github/keep_awake.py